<div class="fondo-hero d-flex align-items-center justify-content-center text-center py-5">
  <div class="container pt-5 my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card rr text-light border-gold p-4 shadow-lg">
          <div class="card-body">
            <h2 class="gold-title fw-bold mb-3">Crear Cuenta</h2>
            <p class="subtitle mb-4">Únete a la familia de The Reyes Records</p>
            
            <form id="form-registro">
              <div class="mb-3 text-start">
                <label for="nombreRegistro" class="form-label text-warning">Nombre Completo / Nombre Artístico</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="nombreRegistro" placeholder="Ej: Pablo Chill-E" required>
              </div>
              <div class="mb-3 text-start">
                <label for="emailRegistro" class="form-label text-warning">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-light border-secondary" id="emailRegistro" placeholder="tu@correo.com" required>
              </div>
              <div class="mb-3 text-start">
                <label for="passRegistro" class="form-label text-warning">Contraseña</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="passRegistro" placeholder="••••••••" required>
              </div>
              <div class="mb-4 text-start">
                <label for="confirmPassRegistro" class="form-label text-warning">Confirmar Contraseña</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="confirmPassRegistro" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3">REGISTRARSE</button>
            </form>

            <p class="mb-0 text-light small">
              ¿Ya tienes cuenta? <a href="login.html" class="text-warning fw-bold text-decoration-none">Inicia sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
