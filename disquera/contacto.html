<main class="fondo-hero d-flex align-items-center justify-content-center min-vh-100 py-5">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card bg-dark text-white border-secondary shadow-lg p-4" style="--bs-bg-opacity: .85; backdrop-filter: blur(5px);">
          <h2 class="text-center mb-3">Contactanos</h2>
          <hr class="divider mx-auto mb-4" style="width: 60px; height: 3px; background-color: #ffc107; opacity: 1;">
          
          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre </label>
              <input type="text" class="form-field form-control bg-secondary text-white border-0" id="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electronico</label>
              <input type="email" class="form-field form-control bg-secondary text-white border-0" id="email" placeholder="nombre@ejemplo.com" required>
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">duda o consulta</label>
              <textarea class="form-control bg-secondary text-white border-0" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
