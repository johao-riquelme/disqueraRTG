<h1 id="elementounico"class="gold-title">Operaciones matematicas</h1>
<div class="container">
     <h1 class="gold-title">ingresa 2 nuemero para realizar las operaciones</h1>
     <form>
  <div class="mb-3">
    <label for="num1" class="form-label">numero 1</label>
    <input type="number" class="form-control" id="n1">
  </div>
  <div class="mb-3">
    <label for="num2" class="form-label">numero 2</label>
    <input type="number" class="form-control" id="n2" >
  </div>
</form>
<button class="btn btn-primary" onclick="sumar()">sumar</button>
<button class="btn btn-primary" onclick="restar()">restar</button>
<button class="btn btn-primary" onclick="multiplicar()">multiplicar</button>
<button class="btn btn-primary" onclick="dividir()">dividir</button>

<div class="mt-2 text-start">
    <p class="fondounico">Resultado: <span id="resultado" class="sumar()">0</span></p>
  </div>
</div>

<script>
    function sumar() {
      let num1=document.getElementById("n1").value;
       let num2=document.getElementById("n2").value;
       let sum= parseFloat(num1) + parseFloat(num2)
       document.getElementById("resultado").textContent = sum;
       console.log(sum);  
    }
    function restar() {
        let num1=document.getElementById("n1").value;
       let num2=document.getElementById("n2").value;
        let res= parseFloat(num1) - parseFloat(num2)
        document.getElementById("resultado").textContent = res;
       console.log(res); 
    }
    function multiplicar() {
        let num1=document.getElementById("n1").value;
       let num2=document.getElementById("n2").value;
        let mul= parseFloat(num1) * parseFloat(num2)
        document.getElementById("resultado").textContent = mul;
       console.log(mul); 
    }
    function dividir() {
        let num1=document.getElementById("n1").value;
       let num2=document.getElementById("n2").value;
        let div= parseFloat(num1) / parseFloat(num2)
        document.getElementById("resultado").textContent = div;
       console.log(div); 
    }
</script>
